name: Build Fast Browser Net

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Accept all SDK licenses non-interactively. Without this, sdkmanager can
      # stop on old Google TV/XR licenses even though the app does not use them.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Repair accidental Markdown URLs
        shell: bash
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/fastbrowser/net/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\"\[([^\"]+)\\]\((https?://[^)]+)\\)\"', r'\"\2\"', s)
          s = re.sub(r'\[([^]]+)\]\((https?://[^)]+)\)', r'\2', s)
          p.write_text(s, encoding='utf-8')
          PYFIX
          grep -Fq 'https://www.google.com/search?q=' app/src/main/java/com/fastbrowser/net/MainActivity.java
          grep -Fq 'ST — Real tunnel / proxy connection' app/src/main/java/com/fastbrowser/net/MainActivity.java
          if grep -Fq '](https://' app/src/main/java/com/fastbrowser/net/MainActivity.java; then
            echo 'Invalid Markdown-style URL remains in MainActivity.java'
            exit 1
          fi

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fast_Browser_Net
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
